<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chính sách — Gift Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .policy-wrap{ max-width:760px; margin:0 auto; padding:32px 20px 60px; }
  .policy-nav{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
  .policy-nav a{ font-size:13px; font-weight:600; color:var(--sage-deep); background:#F4EEFB; padding:8px 14px; border-radius:20px; text-decoration:none; }
  .policy-section{ margin-bottom:36px; scroll-margin-top:20px; }
  .policy-section h2{ font-size:19px; margin-bottom:10px; }
  .policy-section .body{ font-size:14px; line-height:1.8; color:var(--ink-soft); white-space:pre-wrap; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-row">
      <div class="logo">
        <img src="images/logo.png" alt="Gift Lab">
        <div>Gift Lab<span class="sub">by U, for You</span></div>
      </div>
    </div>
  </div>

  <div class="policy-wrap">
    <div class="policy-nav" id="policyNav"></div>
    <div id="policyContent">Đang tải...</div>
  </div>

  <footer>
    <div class="fname">Gift Lab</div>
    <p>By U, for You — đặt hàng trực tiếp trên web, mình sẽ liên hệ xác nhận trước khi gửi SPX.</p>
  </footer>

<script>
const ORDER = ['about', 'terms', 'shipping', 'returns', 'privacy', 'payment', 'contact'];

async function loadPolicies(){
  try{
    const res = await fetch('/api/policies');
    const data = await res.json();
    document.getElementById('policyNav').innerHTML = ORDER
      .map(key => `<a href="#${key}">${escapeHtml(data[key].title)}</a>`)
      .join('');
    document.getElementById('policyContent').innerHTML = ORDER.map(key => `
      <div class="policy-section" id="${key}">
        <h2>${escapeHtml(data[key].title)}</h2>
        <div class="body">${escapeHtml(data[key].content)}</div>
      </div>
    `).join('');
  }catch(e){
    document.getElementById('policyContent').innerHTML = '<p style="color:#B23A3A;">Không tải được nội dung, thử lại sau.</p>';
  }
}
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
loadPolicies();
</script>
</body>
</html>
