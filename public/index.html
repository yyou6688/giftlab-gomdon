<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Lab — By U, for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-row">
      <div class="logo">
        <img src="images/logo.png" alt="Gift Lab">
        <div>Gift Lab<span class="sub">by U, for You</span></div>
      </div>
      <!-- MỚI: khung tìm kiếm nằm cùng hàng, ở giữa -->
      <div class="topbar-search">
        <input type="text" id="siteSearchInput" placeholder="Tìm sản phẩm..." oninput="handleSiteSearch(this.value)">
      </div>
      <div class="topbar-actions">
        <div class="track-link" onclick="openLookup()">Tra cứu đơn hàng</div>
        <div class="cart-btn" onclick="openDrawer()">
          🛍
          <span class="cart-count" id="cartCount" style="display:none">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- BẢN GOM ĐƠN: ẩn banner, dòng tagline, dải bộ sưu tập/danh mục và sản phẩm nổi bật -->
  <!-- vì mỗi lần chỉ gom 1 vài mẫu, không cần các khối này. Trang chủ chỉ còn lưới sản phẩm. -->
  <section class="hero" id="normalHeroSection" style="display:none;">
    <div class="hero-visual">
      <button class="hero-arrow hero-arrow-prev" onclick="heroPrevSlide()" aria-label="Ảnh trước" style="display:none;">‹</button>
      <img id="heroSlideImg" alt="Gift Lab" style="display:none;">
      <button class="hero-arrow hero-arrow-next" onclick="heroNextSlide()" aria-label="Ảnh sau" style="display:none;">›</button>
    </div>
  </section>

  <section class="promo-section promo-hero" id="promoHeroSection" style="display:none;"></section>

  <div class="hero-tagline" style="display:none;">
    <h2>Handmade · Sưu tầm · Quà tặng</h2>
  </div>

  <section class="collections" id="collections" style="display:none;"></section>

  <section class="promo-section" id="promoBelowSection" style="display:none;"></section>


  <section id="featuredProducts" style="display:none;"></section>

  <div id="shop">
    <!-- BẢN GOM ĐƠN: ẩn sidebar danh mục bên trái -->
    <aside class="category-sidebar" id="categorySidebar" style="display:none;"></aside>
    <div class="shop-main">
      <div class="section-head">
        <h2>Sản phẩm</h2>
        <span>
          <!-- MỚI: hiện khi đang lọc 1 danh mục, bấm để xem lại tất cả sản phẩm -->
          <a id="resetFilterLink" onclick="filterByCategory('all')" style="display:none; cursor:pointer; color:var(--rose-deep); font-weight:600; margin-right:10px;">Xem tất cả ✕</a>
          <span id="resultCount">Đang tải...</span>
        </span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- MỚI: khối "Cam kết/Uy tín" - admin tự thêm/sửa/xoá từng mục trong trang quản trị -->
  <div class="trust" id="trustStrip"></div>

  <!-- MỚI: khối Chính sách (điều khoản, vận chuyển, đổi trả, bảo mật, thanh toán) - nội dung
       chỉnh trong trang quản trị, tab "Chính sách". Hiển thị công khai để phục vụ hồ sơ
       thông báo website với Bộ Công Thương. -->
  <div class="policy-block" id="policySection"></div>

  <footer>
    <div class="fname">Gift Lab</div>
    <p>By U, for You — đặt hàng trực tiếp trên web, mình sẽ liên hệ xác nhận trước khi gửi SPX.</p>
    <!-- BẢN GOM ĐƠN: ẩn dòng link chính sách rút gọn ở footer -->
  </footer>

  <div class="float-bar" id="floatBar">
    <div>
      <div class="fcount" id="floatCount">0 món</div>
      <div class="ftotal" id="floatTotal">0đ</div>
    </div>
    <button onclick="openDrawer()">Xem giỏ hàng</button>
  </div>

  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <h3 id="drawerTitle">Giỏ hàng</h3>
      <div class="drawer-close" onclick="closeDrawer()">✕</div>
    </div>
    <div class="drawer-list" id="drawerList"></div>
  </div>

  <!-- MỚI: nút nổi "Quay lại danh mục" - chỉ hiện trên mobile/tablet sau khi cuộn xuống đủ xa -->
  <button class="back-to-categories-btn" id="backToCategoriesBtn" onclick="scrollToCollections()" style="display:none;">
    🗂️ Danh mục
  </button>

  <!-- MỚI: nút liên hệ nổi Facebook + Zalo -->
  <div class="contact-float">
    <a href="https://www.facebook.com/minhlayouu" target="_blank" rel="noopener" class="contact-btn contact-fb" aria-label="Nhắn tin Facebook">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12"/></svg>
    </a>
    <a href="https://zalo.me/0968876380" target="_blank" rel="noopener" class="contact-btn contact-zalo" aria-label="Chat Zalo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.5 5.1 3.8 6.7-.2.9-.7 2.4-.9 3-.2.7.2.7.5.5.4-.2 2.3-1.5 3.3-2.2 1 .3 2.1.4 3.3.4 5.5 0 10-3.9 10-8.4S17.5 2 12 2Z"/></svg>
    </a>
  </div>
  <!-- ↑↑↑ MỚI -->

  <!-- MỚI: trang chi tiết sản phẩm (mở khi bấm vào sản phẩm, có URL riêng /product/<id>) -->
  <div class="product-detail-overlay" id="productDetailOverlay" onclick="if(event.target===this) closeProductDetail(true)">
    <div class="product-detail-panel" id="productDetailPanel"></div>
  </div>

<script src="js/shop.js"></script>
</body>
</html>
