<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Lab — Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<!-- MỚI: đọc/tạo file Excel ngay trên trình duyệt (đổi mã vận đơn hàng loạt, xuất đơn ra Excel) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- MỚI: tạo mã QR ngay trên trình duyệt cho khung "Chia sẻ đợt gom" trong tab Sản phẩm -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>
  <div id="loginView" class="admin-login">
    <div class="logo" style="justify-content:center;">
      <img src="images/logo.png" alt="Gift Lab">
      <div>Gift Lab</div>
    </div>
    <p style="color:var(--ink-soft); font-size:14px; margin-top:8px;">Trang quản trị đơn hàng & sản phẩm</p>
    <input type="password" id="adminKeyInput" placeholder="Nhập mật khẩu quản trị">
    <button onclick="login()">Đăng nhập</button>
    <p id="loginError" style="color:#B23A3A; font-size:13px; margin-top:10px;"></p>
  </div>
  <div id="adminView" class="admin-wrap" style="display:none;">
    <div class="admin-header">
      <div class="logo"><img src="images/logo.png" alt="Gift Lab"><div>Gift Lab · Admin</div></div>
      <button onclick="logout()">Đăng xuất</button>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="orders">Đơn hàng</div>
      <div class="tab" data-tab="products">Sản phẩm</div>
      <!-- MỚI: tab chỉnh cấu hình vận chuyển (cân nặng mặc định, mốc phí, freeship) -->
      <div class="tab" data-tab="shipping">Vận chuyển</div>
      <!-- BẢN GOM ĐƠN: ẩn bớt các tab Trang chủ / Khuyến mãi / Flash Sale / Chính sách -->
      <!-- vì bản này chỉ dùng làm công cụ đặt đơn + quản lý kho vận, không cần các tab đó. -->
      <!-- Muốn dùng lại bản đầy đủ thì bỏ comment 4 dòng dưới đây. -->
      <!--
      <div class="tab" data-tab="homepage">Trang chủ</div>
      <div class="tab" data-tab="promotions">Khuyến mãi</div>
      <div class="tab" data-tab="flashsale">Flash Sale</div>
      <div class="tab" data-tab="policies">Chính sách</div>
      -->
    </div>
    <div id="ordersTab"></div>
    <div id="productsTab" style="display:none;"></div>
    <div id="shippingTab" style="display:none;"></div>
    <div id="homepageTab" style="display:none;"></div>
    <div id="promotionsTab" style="display:none;"></div>
    <div id="flashsaleTab" style="display:none;"></div>
    <div id="policiesTab" style="display:none;"></div>
  </div>
<script src="js/admin.js?v=4"></script>
</body>
</html>
