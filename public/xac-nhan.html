<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xác nhận thông tin nhận hàng - Gift Lab</title>
<style>
  :root{
    --ink:#1c2620; --paper:#fbfaf7; --line:#dcd6c8; --muted:#6b7268;
    --ok-bg:#e7f0e3; --ok-fg:#3a6b34; --ok-line:#a8c79e; --accent:#3a6b34;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif; line-height:1.5;}
  .wrap{max-width:560px; margin:0 auto; padding:28px 18px 60px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px;}
  .shop-head{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:13px; color:var(--muted);}
  .shop-head b{color:var(--ink); font-size:14px;}
  .order-preview{background:var(--ok-bg); border:1px solid var(--ok-line); border-radius:8px; padding:12px 14px; margin-bottom:16px; font-size:13px; color:#2f4d2a;}
  .order-preview .label{font-size:11px; color:var(--ok-fg); font-weight:600; text-transform:uppercase; margin-bottom:6px;}
  .order-preview .item-line{display:flex; justify-content:space-between; padding:2px 0;}
  .field{margin-bottom:14px; position:relative;}
  .field label{display:block; font-size:11.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.02em; margin-bottom:5px;}
  .field input, .field textarea{width:100%; padding:9px 10px; font-size:14px; border-radius:6px; border:1px solid var(--line); background:#fdfcf9; color:var(--ink); font-family:inherit;}
  .field textarea{resize:vertical; min-height:50px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .combo-wrap{position:relative;}
  .combo-list{position:absolute; top:100%; left:0; right:0; z-index:30; background:#fff; border:1px solid var(--line); border-top:none; max-height:200px; overflow-y:auto; box-shadow:0 6px 14px rgba(0,0,0,.1); display:none; border-radius:0 0 6px 6px;}
  .combo-list.open{display:block;}
  .combo-opt{padding:8px 9px; font-size:13.5px; cursor:pointer;}
  .combo-opt:hover, .combo-opt.active{background:var(--ok-bg);}
  .combo-empty{padding:8px 9px; font-size:12px; color:var(--muted); font-style:italic;}
  .checkbox-row{display:flex; align-items:flex-start; gap:8px; font-size:13px; margin:16px 0; padding:10px 12px; background:#fdfaf3; border:1px solid #ecdfb8; border-radius:8px;}
  .checkbox-row input{margin-top:2px;}
  .submit-btn{width:100%; padding:12px; margin-top:6px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .submit-btn:hover{opacity:.92;}
  .submit-btn:disabled{opacity:.6; cursor:not-allowed;}
  .foot-note{font-size:11.5px; color:var(--muted); text-align:center; margin-top:12px;}
  .thanks{text-align:center; padding:36px 10px;}
  .thanks .big{font-size:19px; font-weight:700; margin-bottom:8px;}
  .thanks .sub{font-size:13.5px; color:var(--muted);}
  .summary-row{display:flex; justify-content:space-between; gap:10px; padding:4px 0; font-size:13px; border-bottom:1px dashed var(--ok-line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row .k{color:#5a7a54; flex-shrink:0;}
  .summary-row .v{font-weight:600; text-align:right;}
  .state-msg{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="loadingCard">
    <div class="state-msg">Đang tải thông tin đơn hàng...</div>
  </div>

  <div class="card" id="errorCard" style="display:none;">
    <div class="state-msg" id="errorMsg"></div>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <div class="shop-head">📦 <b>Gift Lab - by U, for You</b> · xác nhận thông tin nhận hàng</div>

    <div class="order-preview">
      <div class="label">Đơn của quý khách</div>
      <div id="orderItems"></div>
    </div>

    <div class="field">
      <label>Tên người nhận</label>
      <input type="text" id="fName" placeholder="VD: Nguyễn Thị A">
    </div>
    <div class="field">
      <label>Số điện thoại</label>
      <input type="text" id="fPhone" placeholder="VD: 0912345678">
    </div>

    <div class="two-col">
      <div class="field">
        <label>Tỉnh/Thành Phố</label>
        <div class="combo-wrap" id="provBox"></div>
      </div>
      <div class="field">
        <label>Xã/Phường</label>
        <div class="combo-wrap" id="wardBox"></div>
      </div>
    </div>

    <div class="field">
      <label>Địa chỉ chi tiết (số nhà, ngõ, đường...)</label>
      <input type="text" id="fDetail" placeholder="VD: 578/63 Lê Trọng Tấn">
    </div>
    <div class="field">
      <label>Ghi chú giao hàng (không bắt buộc)</label>
      <textarea id="fNote" placeholder="VD: giao giờ hành chính, gọi trước khi đến..."></textarea>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="fShipCod">
      Trả phí ship khi nhận hàng (SPX thu hộ, không cần chuyển khoản phần này)
    </label>

    <button class="submit-btn" id="submitBtn">Xác nhận thông tin</button>
    <div class="foot-note">Xác nhận xong sẽ không sửa lại được — cần sửa thì nhắn shop gửi lại link mới.</div>
  </div>

  <div class="card" id="thanksCard" style="display:none;">
    <div class="thanks">
      <div class="big">🎉 Tada~, zị là xong gùi!</div>
      <div class="sub">Cảm ơn <b id="thanksName"></b> đã hỗ trợ U ^^</div>
    </div>
    <div class="order-preview" style="display:block;">
      <div class="label">Thông tin bạn vừa gửi — kiểm tra lại lần nữa nhé</div>
      <div id="summaryLines"></div>
    </div>
  </div>
</div>

<script>
// ============================================================
// MỚI: trang dùng chung cho MỌI shop - không gắn cứng link/mã của riêng shop nào nữa.
// Toàn bộ thông tin (link Apps Script, mã công khai, mã đơn, token riêng của đơn) lấy
// thẳng từ tham số trên link - đúng link tool sinh ra khi bấm "Copy link xác nhận".
// ============================================================
const params = new URLSearchParams(location.search);
const orderId = params.get("id");
const confirmToken = params.get("ct");
const sheetUrl = params.get("su");
const publicToken = params.get("pt");

const loadingCard = document.getElementById("loadingCard");
const errorCard = document.getElementById("errorCard");
const formCard = document.getElementById("formCard");
const thanksCard = document.getElementById("thanksCard");

function showError(msg){
  loadingCard.style.display = "none";
  formCard.style.display = "none";
  errorCard.style.display = "block";
  document.getElementById("errorMsg").textContent = msg;
}

async function callApi(payload){
  const res = await fetch(sheetUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ token: publicToken }, payload))
  });
  return res.json();
}

// ---------- combobox gõ-để-lọc (giống hệt trong tool) ----------
const ADDR = __ADDR_JSON__;
function comboNormalize(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
}
function createCombobox(container, options, value, onCommit){
  container.innerHTML = "";
  const input = document.createElement("input");
  input.type = "text"; input.autocomplete = "off"; input.value = value || "";
  input.placeholder = "Gõ để lọc...";
  const list = document.createElement("div");
  list.className = "combo-list";
  container.appendChild(input); container.appendChild(list);
  let committed = value || "", activeIdx = -1, currentOptions = options;
  function renderList(filterText){
    const q = comboNormalize(filterText);
    const filtered = q ? currentOptions.filter(o=>comboNormalize(o).includes(q)) : currentOptions;
    list.innerHTML = ""; activeIdx = -1;
    if(!filtered.length){
      const e = document.createElement("div"); e.className="combo-empty"; e.textContent="Không tìm thấy — kiểm tra lại cách gõ";
      list.appendChild(e);
    } else {
      filtered.slice(0,80).forEach(opt=>{
        const item = document.createElement("div"); item.className="combo-opt"; item.textContent=opt;
        item.addEventListener("mousedown", (e)=>{ e.preventDefault(); commit(opt); });
        list.appendChild(item);
      });
    }
    list.classList.add("open");
  }
  function closeList(){ list.classList.remove("open"); }
  function commit(val){ committed=val; input.value=val; closeList(); onCommit(val); }
  input.addEventListener("focus", ()=> renderList(input.value === committed ? "" : input.value));
  input.addEventListener("input", ()=> renderList(input.value));
  input.addEventListener("keydown", (e)=>{
    const opts = Array.from(list.querySelectorAll(".combo-opt"));
    if(e.key==="ArrowDown"){ e.preventDefault(); activeIdx=Math.min(activeIdx+1,opts.length-1); opts.forEach((o,i)=>o.classList.toggle("active",i===activeIdx)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); activeIdx=Math.max(activeIdx-1,0); opts.forEach((o,i)=>o.classList.toggle("active",i===activeIdx)); }
    else if(e.key==="Enter"){ e.preventDefault(); if(activeIdx>=0&&opts[activeIdx]) commit(opts[activeIdx].textContent); else if(currentOptions.includes(input.value)) commit(input.value); }
    else if(e.key==="Escape"){ input.value=committed; closeList(); }
  });
  input.addEventListener("blur", ()=>{
    setTimeout(()=>{ closeList(); if(!currentOptions.includes(input.value)){ committed=""; input.value=""; onCommit(""); } }, 120);
  });
  return { setOptions(o, v){ currentOptions=o; committed=v||""; input.value=committed; input.placeholder=o.length?"Gõ để lọc...":"— chọn tỉnh trước —"; } };
}
let wardCombo, currentProvince = "", currentWard = "";
const provCombo = createCombobox(document.getElementById("provBox"), ADDR.provinces, "", (val)=>{
  currentProvince = val; currentWard = "";
  wardCombo.setOptions(ADDR.wardsByProvince[val] || [], "");
});
wardCombo = createCombobox(document.getElementById("wardBox"), [], "", (val)=>{ currentWard = val; });

// ---------- tải dữ liệu đơn ----------
(async function init(){
  if (!orderId || !confirmToken || !sheetUrl || !publicToken){ showError("Link không hợp lệ — thiếu thông tin."); return; }
  try {
    const data = await callApi({ action: "get_order_for_confirm", orderId, confirmToken });
    if (data.status === "locked"){ showError("Đơn này đã được xác nhận trước đó rồi. Cần sửa lại thì nhắn shop gửi cho bạn link mới nhé."); return; }
    if (data.status !== "ok"){ showError(data.message || "Không tìm thấy đơn hàng này."); return; }
    const order = data.order;
    document.getElementById("orderItems").innerHTML =
      (order.itemsText || "").split(",").map(s=>s.trim()).filter(Boolean)
        .map(s=>`<div class="item-line"><span>${s}</span></div>`).join("") || "<div class=\"item-line\">(chưa có sản phẩm)</div>";
    document.getElementById("fName").value = order.customerName || "";
    document.getElementById("fPhone").value = order.phone || "";
    loadingCard.style.display = "none";
    formCard.style.display = "block";
  } catch(e){
    showError("Không tải được thông tin đơn hàng, thử tải lại trang. (" + e.message + ")");
  }
})();

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  const btn = document.getElementById("submitBtn");
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const detail = document.getElementById("fDetail").value.trim();
  const note = document.getElementById("fNote").value.trim();
  const shipCod = document.getElementById("fShipCod").checked;

  if (!name || !phone){ alert("Bạn nhập đủ Tên người nhận và Số điện thoại giúp shop nhé."); return; }
  if (!currentProvince || !currentWard){ alert("Bạn chọn đủ Tỉnh/Thành Phố và Xã/Phường giúp shop nhé."); return; }
  if (!detail){ alert("Bạn nhập Địa chỉ chi tiết (số nhà, ngõ, đường...) giúp shop nhé."); return; }

  btn.disabled = true;
  btn.textContent = "Đang gửi...";
  try {
    const data = await callApi({
      action: "submit_confirm", orderId, confirmToken,
      customerName: name, phone, province: currentProvince, ward: currentWard,
      addressDetail: detail, note, codShipping: shipCod
    });
    if (data.status !== "ok") throw new Error(data.message || "Gửi thất bại");

    const lines = [
      ["Tên người nhận", name], ["Số điện thoại", phone],
      ["Tỉnh/Thành Phố", currentProvince], ["Xã/Phường", currentWard],
      ["Địa chỉ chi tiết", detail]
    ];
    if (note) lines.push(["Ghi chú", note]);
    lines.push(["Phí ship", shipCod ? "Trả khi nhận hàng (SPX thu hộ)" : "Đã trả trước"]);
    document.getElementById("summaryLines").innerHTML = lines.map(([k,v])=>
      `<div class="summary-row"><span class="k">${k}</span><span class="v">${v}</span></div>`
    ).join("");
    document.getElementById("thanksName").textContent = name;
    formCard.style.display = "none";
    thanksCard.style.display = "block";
  } catch(e){
    alert("Có lỗi khi gửi: " + e.message + " — thử lại giúp shop nhé.");
    btn.disabled = false;
    btn.textContent = "Xác nhận thông tin";
  }
});
</script>
</body>
</html>
